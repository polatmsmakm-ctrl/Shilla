name: Build Windows
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'Shilla/Secrets.swift', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JellyJump-exe
          path: desktop/dist/JellyJump.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "pc-${{ github.run_number }}" dist/JellyJump.exe \
            --repo "${{ github.repository }}" \
            --title "Jelly Jump PC build ${{ github.run_number }}" \
            --notes "Windows portable exe. Double-click to run."

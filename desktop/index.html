<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src wss: ws:; img-src 'self' data:">
<title>Jelly Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="app" hidden>
    <div id="welcome" class="welcome" hidden>
      <div class="welcome-card">
        <div class="logo"></div>
        <h1>TextVast</h1>
        <p class="muted">محادثات أفضل، أصدقاء أقرب</p>
        <div class="field ltr"><span>@</span><input id="w-name" maxlength="20" placeholder="username" autocomplete="off" spellcheck="false"></div>
        <p id="w-hint" class="muted small">اسم ثابت يعرفك فيه أصدقاؤك (حروف إنجليزية وأرقام، 3 إلى 20)</p>
        <button id="w-go" class="btn primary wide">ابدأ</button>
      </div>
    </div>

    <div id="main" class="main" hidden>
      <aside class="side">
        <div class="side-head">
          <div class="me">
            <div id="me-avatar" class="avatar sm"></div>
            <div>
              <div id="me-name" class="bold"></div>
              <div id="net" class="small muted"></div>
            </div>
          </div>
          <div class="icons">
            <button class="icon-btn" id="b-add" title="إضافة صديق">＋</button>
            <button class="icon-btn" id="b-settings" title="الإعدادات">⚙</button>
            <button class="icon-btn" id="b-lock" title="رجوع للعبة (Esc)">🎮</button>
          </div>
        </div>
        <input id="search" class="search" placeholder="ابحث…">
        <div id="friends" class="friends"></div>
      </aside>

      <section class="chat">
        <div id="empty" class="empty">
          <div class="big">💬</div>
          <p>اختر صديق من القائمة أو أضف واحد جديد</p>
        </div>
        <div id="chat-wrap" class="chat-wrap" hidden>
          <header class="chat-head">
            <div id="peer-avatar" class="avatar sm"></div>
            <div>
              <div id="peer-name" class="bold"></div>
              <div id="peer-status" class="small"></div>
            </div>
          </header>
          <div id="banner" class="banner" hidden></div>
          <div id="msgs" class="msgs"></div>
          <footer class="composer">
            <button class="icon-btn" id="b-file" title="إرسال ملفات">📄</button>
            <button class="icon-btn" id="b-folder" title="إرسال مجلد">📁</button>
            <textarea id="text" rows="1" placeholder="اكتب رسالة… (Enter للإرسال)"></textarea>
            <button class="send" id="b-send" title="إرسال">➤</button>
          </footer>
          <div id="drop" class="drop" hidden>أفلت الملفات أو المجلدات هنا للإرسال</div>
        </div>
      </section>
    </div>
  </div>

  <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script>
    const path = require('path');
    require(path.join(__dirname, 'src', 'ui.js'));
  </script>
</body>
</html>
